<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GrayMatter Estimator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' rx='5' transform='rotate(45 16 16)' fill='%232377A2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0F4C75; --navy-2: #0C3F62; --blue: #2377A2; --sky: #8EC1DE; --orange: #F28C38;
  --ink: #333333; --muted: #67737D; --paper: #F5F5F5; --card: #FFFFFF; --rule: #DCE2E7; --rule-soft: #ECEFF2;
  --field: #FFFFFF; --field-line: #C8D1D8; --tint: #F2F7FA; --ok: #1F7A4D; --warn: #9A4A06; --warn-bg: #FFF4E8; --bad: #B42318;
  --c1: #0F4C75; --c2: #2377A2; --c3: #8EC1DE; --c4: #5E6B75; --c5: #C9D3DA; --c6: #B7D3E6;
  --head: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
  --body: "Open Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --navy: #0B3A5A; --navy-2: #092F4A; --blue: #5AA9D6; --ink: #E5EAEE; --muted: #97A5B0; --paper: #10171D; --card: #172129;
    --rule: #2A3742; --rule-soft: #212C35; --field: #0F171D; --field-line: #354552; --tint: #1A2631;
    --ok: #5BC48D; --warn: #F5B169; --warn-bg: #2A2115; --bad: #F97066;
    --c1: #5AA9D6; --c2: #8EC1DE; --c3: #2F6F98; --c4: #8C9AA5; --c5: #3A4955; --c6: #426A86;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--head); font-weight: 800; margin: 0; letter-spacing: -0.01em; }
.n { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 20; }
.top-in { display: flex; align-items: center; gap: 22px; padding: 0 32px; min-height: 64px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { height: 24px; display: block; }
.brand span { font-family: var(--head); font-weight: 800; font-size: 15px; padding-left: 14px; border-left: 1px solid rgba(255,255,255,.3); }
.tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
.tab { background: none; border: 0; color: rgba(255,255,255,.72); padding: 20px 12px 17px; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 600; white-space: nowrap; }
.tab:hover { color: #fff; }
.tab[aria-selected="true"] { color: #fff; border-bottom-color: #fff; }
.actions { display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--field-line); background: var(--card); color: var(--ink); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--blue); padding: 6px 8px; }
.btn.danger { color: var(--bad); }
.top .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
.top .btn:hover { background: rgba(255,255,255,.12); }
.top .btn.primary { background: #fff; color: var(--navy); border-color: #fff; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; right: 0; top: 40px; background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.18); padding: 6px; min-width: 240px; display: flex; flex-direction: column; z-index: 30; }
.menu .pop button { background: none; border: 0; text-align: left; padding: 9px 12px; border-radius: 5px; cursor: pointer; color: var(--ink); }
.menu .pop button:hover { background: var(--tint); }
.menu .pop hr { border: 0; border-top: 1px solid var(--rule); margin: 5px 0; }

/* Dashboard hero */
.hero { background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; padding: 26px 32px 84px; }
.hero-id h1 { font-size: 22px; }
.hero-id p { margin: 2px 0 0; color: rgba(255,255,255,.72); font-size: 13.5px; }
.hero-main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px 56px; margin-top: 22px; align-items: end; }
.price-label { font-size: 13px; color: rgba(255,255,255,.75); }
.price { display: block; font-family: var(--head); font-weight: 800; font-size: clamp(44px, 6.4vw, 76px); line-height: 1.02; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.dial { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; margin-top: 18px; max-width: 560px; }
.dial label { font-size: 13px; color: rgba(255,255,255,.75); }
.dial output { font-family: var(--head); font-weight: 800; font-size: 30px; color: var(--orange); font-variant-numeric: tabular-nums; min-width: 3.6em; }
.dial input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--orange); height: 22px; }
.dial .scale { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11.5px; color: rgba(255,255,255,.6); margin-top: -4px; }
.target { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: rgba(255,255,255,.8); }
.target input { width: 150px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 6px; padding: 6px 10px; }
.target input::placeholder { color: rgba(255,255,255,.5); }
.target b { color: #fff; }
.target .btn { padding: 4px 10px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; margin: 0; }
.kpis div { border-top: 1px solid rgba(255,255,255,.22); padding-top: 10px; }
.kpis dt { font-size: 12.5px; color: rgba(255,255,255,.72); }
.kpis dd { margin: 2px 0 0; font-family: var(--head); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }

main { padding: 24px 32px 40px; max-width: 1480px; }
.hero:not([hidden]) + main { margin-top: -64px; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; margin-bottom: 20px; }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card h2 { font-size: 16px; color: var(--navy); }
@media (prefers-color-scheme: dark) { .card h2 { color: var(--blue); } }
.card .hint { color: var(--muted); font-size: 13px; margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-bottom: 20px; }
.grid2 > .card { margin-bottom: 0; }
.build-card { box-shadow: 0 10px 30px rgba(15,76,117,.12); }

/* Price build-up */
.stack { display: flex; height: 26px; border-radius: 6px; overflow: hidden; background: var(--rule-soft); }
.stack i { display: block; height: 100%; }
.stack i + i { box-shadow: -2px 0 0 var(--card); }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 14px 20px; margin-top: 16px; }
.legend div { display: grid; grid-template-columns: 12px 1fr; gap: 2px 10px; align-items: center; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.legend span { font-size: 12.5px; color: var(--muted); }
.legend b { grid-column: 2; font-family: var(--head); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.legend .eq b { color: var(--ink); }
.legend .eq { border-left: 2px solid var(--rule); padding-left: 14px; }

/* Donut */
.donut-wrap { display: grid; grid-template-columns: 190px 1fr; gap: 24px; align-items: center; }
.donut-wrap svg { width: 190px; height: 190px; display: block; }
.donut-mid { font-family: var(--head); font-weight: 800; font-size: 26px; fill: var(--ink); }
.donut-sub { font-size: 12px; fill: var(--muted); }
.keys { display: grid; gap: 10px; }
.key { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; font-size: 13.5px; }
.key .sw { width: 12px; height: 12px; border-radius: 3px; }
.key .n { text-align: right; }
.key .p { color: var(--muted); font-size: 12.5px; width: 48px; text-align: right; }

/* Bars */
.bars { display: grid; gap: 12px; }
.bar { display: grid; grid-template-columns: minmax(110px, 250px) 1fr 64px; gap: 12px; align-items: center; font-size: 13.5px; }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .lbl small { display: block; color: var(--muted); font-size: 12px; }
.bar .track { height: 12px; background: var(--rule-soft); border-radius: 6px; overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--c2); border-radius: 6px; }
.bar .n { text-align: right; font-weight: 600; }

/* Checks */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.checks li { display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: baseline; font-size: 13.5px; }
.checks .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
.checks .dot.warn { background: var(--orange); }
.checks .dot.bad { background: var(--bad); }
.checks .dot.ok { background: var(--ok); }

/* Tables */
.scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--rule-soft); vertical-align: middle; }
table.t .r { text-align: right; }
table.t td.r { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t input, table.t select { width: 100%; border: 1px solid var(--field-line); background: var(--field); color: var(--ink); border-radius: 6px; padding: 7px 9px; min-width: 0; }
table.t input.num { text-align: right; }
table.t tfoot td { border-bottom: 0; }
table.t tr.auto td { color: var(--muted); background: var(--tint); }
table.t tr.sum td { font-weight: 700; border-top: 2px solid var(--navy); padding-top: 10px; }
@media (prefers-color-scheme: dark) { table.t tr.sum td { border-top-color: var(--blue); } }
table.t tr.phase td { font-family: var(--head); font-weight: 800; color: var(--navy); padding-top: 16px; border-bottom-color: var(--rule); }
@media (prefers-color-scheme: dark) { table.t tr.phase td { color: var(--blue); } }
table.t tr.sub td { font-weight: 600; color: var(--muted); }
table.t .big { font-family: var(--head); font-weight: 800; font-size: 16px; }
.tasks .c-phase { width: 15%; min-width: 130px; } .tasks .c-task { width: 28%; min-width: 220px; } .tasks .c-level { width: 15%; min-width: 140px; }
.tasks .c-num { width: 90px; min-width: 80px; } .tasks .c-tot { width: 100px; } .tasks .c-notes { min-width: 160px; } .tasks .c-act { width: 120px; }
.tasks td.tot { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.row-act { display: flex; gap: 2px; justify-content: flex-end; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--tint); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; }
.chip b { font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty p { margin: 0 0 14px; }

/* Forms */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 18px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--field-line); background: var(--field); color: var(--ink); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.field textarea { min-height: 72px; resize: vertical; }
.field .sfx { position: relative; }
.field .sfx input { width: 100%; padding-right: 28px; }
.field .sfx::after { content: attr(data-sfx); position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
input.bad { border-color: var(--bad) !important; }
.note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

/* Start + dialog */
.start { max-width: 660px; margin: 56px auto; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 36px; }
.start h1 { font-size: 28px; color: var(--navy); margin-bottom: 10px; }
@media (prefers-color-scheme: dark) { .start h1 { color: var(--blue); } }
.start p { margin: 0 0 12px; }
.start .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0 16px; }
.start .fine { color: var(--muted); font-size: 13px; }
dialog { border: 1px solid var(--rule); border-radius: 12px; padding: 26px; max-width: 520px; width: calc(100% - 32px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(8, 28, 44, .55); }
dialog h2 { font-size: 19px; color: var(--navy); margin-bottom: 6px; }
@media (prefers-color-scheme: dark) { dialog h2 { color: var(--blue); } }
dialog .file { color: var(--muted); font-size: 13px; margin: 0 0 16px; word-break: break-all; }
dialog .preview { background: var(--tint); border-radius: 8px; padding: 12px 14px; margin: 14px 0; font-size: 13.5px; }
dialog .preview b { font-variant-numeric: tabular-nums; }
dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
dialog .err { color: var(--bad); font-size: 13.5px; }

footer { padding: 0 32px 28px; color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
#status { font-weight: 600; }

@media (max-width: 900px) {
  .hero-main { grid-template-columns: 1fr; }
  .donut-wrap { grid-template-columns: 1fr; justify-items: center; }
  .donut-wrap .keys { width: 100%; }
}
@media (max-width: 640px) {
  .top-in, .hero, main, footer { padding-left: 16px; padding-right: 16px; }
  .top-in { gap: 8px 14px; padding-top: 10px; }
  .tabs { order: 3; flex-basis: 100%; }
  .tab { padding: 10px 10px 9px; }
  .grid2 { grid-template-columns: 1fr; }
  .kpis dd { font-size: 20px; }
}
@media print {
  .top, .toolbar, .row-act, .target, footer #status { display: none !important; }
  .hero { -webkit-print-color-adjust: exact; print-color-adjust: exact; padding-bottom: 24px; }
  .hero:not([hidden]) + main { margin-top: 0; }
  .card { break-inside: avoid; }
  table.t input, table.t select { border: 0; padding: 0; background: transparent; }
}
[hidden] { display: none !important; }
.hero[hidden] + main { margin-top: 0; }
.field small { color: var(--muted); font-size: 12px; }
.btn:disabled { opacity: .35; cursor: default; }

/* ---------- v2: worksheets, status line, expenses ---------- */
.wsbar { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.wstabs { display: flex; gap: 6px; flex-wrap: wrap; }
.wstab { border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; gap: 8px; align-items: baseline; }
.wstab small { font-weight: 400; color: var(--muted); font-size: 11.5px; }
.wstab[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.wstab[aria-pressed="true"] small { color: rgba(255,255,255,.75); }
.wstab.add { background: transparent; border-style: dashed; color: var(--blue); }
.wsset { display: flex; gap: 12px 18px; align-items: flex-end; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft); }
label.mini { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
label.mini input { border: 1px solid var(--field-line); background: var(--field); color: var(--ink); border-radius: 6px; padding: 6px 9px; width: 110px; }
label.mini.grow input { width: 220px; }
label.mini .sfx { position: relative; }
label.mini .sfx::after, td .sfx::after { content: attr(data-sfx); position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12.5px; }
td .sfx { position: relative; display: block; }
td .sfx input { padding-right: 24px; }
label.check { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; padding-bottom: 7px; }
label.check input { width: 16px; height: 16px; accent-color: var(--blue); }
.statusline { position: sticky; bottom: 0; z-index: 15; display: flex; flex-wrap: wrap; gap: 6px 26px; align-items: baseline; background: var(--card); border-top: 1px solid var(--rule); padding: 10px 32px; box-shadow: 0 -6px 18px rgba(15,76,117,.06); font-size: 13px; }
.statusline .sl-label { font-family: var(--head); font-weight: 800; color: var(--navy); }
@media (prefers-color-scheme: dark) { .statusline .sl-label { color: var(--blue); } }
.statusline span { display: inline-flex; gap: 8px; align-items: baseline; }
.statusline small { color: var(--muted); font-size: 12px; }
.statusline b { font-variant-numeric: tabular-nums; }
.statusline .sl-m { color: var(--orange); }
.statusline .sl-note { margin-left: auto; color: var(--muted); font-size: 12px; }
.linkish { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 600; cursor: pointer; font: inherit; font-weight: 600; text-align: left; }
.tag { font-size: 12px; color: var(--muted); font-weight: 400; }
table.t tr.off td { color: var(--muted); }
table.t tr.cur td { background: var(--tint); font-weight: 700; }
table.t tr.wsrow td { font-family: var(--head); font-weight: 800; font-size: 15px; padding-top: 22px; border-bottom: 2px solid var(--rule); }
table.t .c-inc { width: 70px; text-align: center; }
table.t td.c-inc input, table.t td.c-pmb input { width: 16px; height: 16px; accent-color: var(--blue); }
table.t .c-pmb { width: 72px; text-align: center; }
table.t .c-unit { width: 120px; }
.sub-h { font-size: 14px; margin: 18px 0 10px; }
.tablist { margin: 6px 0 8px; padding-left: 18px; }
@media (max-width: 640px) { .statusline { padding: 10px 16px; gap: 4px 16px; } .statusline .sl-note { margin-left: 0; } label.mini.grow input { width: 100%; } }
@media print { .statusline, .wsbar .wstab.add, .wsset .btn { display: none !important; } }

/* ---------- v3: combined price breakdown and complexity matrix ---------- */
table.pb .o { color: var(--ink); }
table.pb .pr, table.cxl .pr { font-weight: 700; }
table.t tr.cxrow td { background: var(--tint); }
table.t tr.cxrow td small { display: block; color: var(--muted); font-size: 12px; }
table.t tr.auto.strong td { color: var(--ink); font-weight: 700; }
table.t .empty-row { color: var(--muted); padding: 16px 8px; }
.linkish.small { font-size: 12.5px; margin-left: 10px; font-family: var(--body); }
table.t tr.phase .linkish.small { font-weight: 600; }
.filters { display: flex; gap: 12px 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
.filters select { border: 1px solid var(--field-line); background: var(--field); color: var(--ink); border-radius: 6px; padding: 6px 9px; min-width: 160px; }
table.matrix .c-cx { width: 64px; }
table.matrix input.cx { min-width: 54px; }
table.matrix input.ovr { border-color: var(--orange); font-weight: 700; }
table.matrix input::placeholder, table.cxl input::placeholder { color: var(--muted); opacity: .9; }
.stage-sum { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stage-sum .hrs-in input { width: 90px; }
table.t.inner { width: auto; min-width: 380px; margin: 4px 0 10px; }
table.t tr.stages > td { background: var(--tint); }
table.cxl .c-area { min-width: 130px; } table.cxl .c-type { min-width: 120px; } table.cxl .c-task { min-width: 180px; }
table.t.compact td, table.t.compact th { padding: 6px 8px; }
.tablist.checks-list { list-style: none; padding-left: 0; display: grid; gap: 6px; }
.tablist.checks-list label.check { padding-bottom: 0; align-items: flex-start; }
.tablist.checks-list label.check input { margin-top: 2px; }
table.pb .c-phase { min-width: 110px; width: 11%; } table.pb .c-task { min-width: 190px; } table.pb .c-level { min-width: 120px; width: 11%; }
table.pb .c-num { width: 72px; min-width: 64px; } table.pb .c-notes { min-width: 90px; width: 9%; } table.pb .c-act { width: 112px; }
table.pb td, table.pb th { padding-left: 5px; padding-right: 5px; }
table.pb .row-act .btn { padding: 6px 5px; }

    app: 'gm-simple-estimator', version: 2,
    project: { name: '', customer: '', number: '', rev: '0', preparedBy: '', notes: '' },
    settings: { margin: 0, pmPct: 0, contPct: 0, escPct: 0, pmLevel: 'PM', expMargin: 0, expEscPct: 0, pmRule: 'all' },
    levels: [
      { id: 'ENG_I', name: 'Eng I', code: 'ENG_I', cost: 0, margin: null },
      { id: 'ENG_II', name: 'Eng II', code: 'ENG_II', cost: 0, margin: null },
      { id: 'ENG_SR', name: 'Eng Sr', code: 'ENG_SR', cost: 0, margin: null },
      { id: 'PM', name: 'Project manager', code: 'PROJ_MGR', cost: 0, margin: null }
    ],
    setpoints: [['Airfare', 'trip'], ['Lodging', 'night'], ['Meals', 'day'], ['Miscellaneous', 'day'], ['Rental car', 'day'], ['Private automobile', 'mile'], ['Per diem', 'day'], ['Per week', 'week']]
      .map(([name, unit]) => ({ id: uid('s'), name, unit, cost: 0 })),

/* Complexity matrix: hours per item by type and complexity 0-6. A blank cell uses hours per point × complexity. */
const CX_LEVELS = [0, 1, 2, 3, 4, 5, 6];
function blankMatrix() {
  return { types: [
    { id: 'graphic', name: 'Graphic', basis: 'scale', perPoint: null, hours: [null, null, null, null, null, null, null], stages: [], fixed: null },
    { id: 'popup', name: 'Popup', basis: 'scale', perPoint: null, hours: [null, null, null, null, null, null, null], stages: [], fixed: null },
    { id: 'dashboard', name: 'Dashboard', basis: 'fixed', perPoint: null, hours: [null, null, null, null, null, null, null], stages: [], fixed: null }
  ], mix: [], lines: [] };
}
function typeHours(t, cx) {
  if (!t) return 0;

function normalize(q) {

  const b = blankEstimate();

  q.project = Object.assign({}, b.project, q.project || {});
  q.settings = Object.assign({}, b.settings, q.settings || {});

  if (!Array.isArray(q.worksheets) || !q.worksheets.length) {
    const ws = blankWorksheet((q.source && q.source.sheet) || 'Worksheet 1');
    q.worksheets = [ws];

/* ---------- Calculation: mirrors an estimating tab plus the Financial roll-up ---------- */
function calc(st, opt = {}) {

  const out = { tasks: {}, exp: {}, ws: {}, m: mDef, e, eE, mE };

  const Q = { hrs: 0, cost: 0, price: 0, taskHrs: 0, taskCost: 0, taskPrice: 0, pmCost: 0, pmPrice: 0, pmHrs: 0, contCost: 0, contPrice: 0, contHrs: 0, laborEsc: 0, expCost: 0, expEsc: 0, expPrice: 0, laborCost: 0, laborPrice: 0, expTotal: 0 };

async function extractOrganized(wb) {

    b.lines.forEach(l => lines.push({ id: uid('c'), area: l.area, title: l.title, type: typeId, cx: l.cx, qty: 1, level: 'mix', notes: '', _g: key }));
    report.push({ key, label, typeId, n: b.lines.length, hrs: b.lines.reduce((a, l) => a + l.cx * num(b.perPoint), 0), sheet: b.subtotals || null, on: !opt });
  };

  if (G) complexityBlocks(G).forEach(b => addBlock('graphic', b, 'Graphics'));
  if (P) complexityBlocks(P).forEach(b => addBlock('popup', b, 'Popups'));
  // Any other tab laid out the same way (Crush): match each block to a type by its hours per point

      if (src.kind === 'estimator' && src.tabs) {
        const parts = S.worksheets.filter(w => w.include !== false && src.tabs[w.id]).map(w => ({ w, d: R.ws[w.id].price - src.tabs[w.id].price })).filter(x => Math.abs(x.d) >= 1);
        if (parts.length) msg += ' By worksheet: ' + parts.map(x => `${h(x.w.name)} ${x.d > 0 ? '+' : '−'}${money(Math.abs(x.d))}`).join(', ') + '.';
      }

      }
    }
    if (src.final.approver && R.approver && src.final.approver !== R.approver && Math.abs(diff) < 1) c.push(['warn', `The workbook's DOA tab says ${h(src.final.approver)}; this estimate says ${h(R.approver)}.`]);
    (src.notes || []).forEach(n => c.push(['warn', h(n)]));
    if (src.tabs) S.worksheets.filter(w => w.include !== false && src.tabs[w.id] && Math.abs(src.tabs[w.id].other) > 1)
      .forEach(w => c.push(['warn', `${h(w.name)} has ${money(src.tabs[w.id].other)} of materials or subcontracts in the workbook, which the app does not carry yet.`]));
  }
  if (S.settings.pmRule === 'workbook') {
    const outT = S.tasks.filter(t => t.pmBase === false && (wsById(t.ws) || {}).include !== false);
    if (outT.length) {
      const alt = calc({ ...S, settings: { ...S.settings, pmRule: 'all' } });
      c.push(['info', `PM follows the workbook rule, which leaves ${outT.length} task line${outT.length > 1 ? 's' : ''} out of the PM base (${outT.slice(0, 3).map(t => h(t.name)).join(', ')}${outT.length > 3 ? ', …' : ''}). Counting them adds ${money(alt.price - R.price)}. <button class="linkish" data-act="pmRule" data-v="all">Count every task</button>`]);

  if (badCx) c.push(['warn', `${badCx} complexity line${badCx > 1 ? 's have' : ' has'} no type or a complexity outside 0 to 6, so ${badCx > 1 ? 'they count' : 'it counts'} as 0 hours.`]);

  if (ex.length) c.push(['info', `${ex.map(w => h(w.name)).join(', ')} ${ex.length > 1 ? 'are' : 'is'} excluded from the final total.`]);

  c.push(['info', 'Draft estimate. A qualified person reviews hours, rates and margin before the price is sent.']);
  return c;
}

/* ---------- Events ---------- */
function setFrom(el) {
  const segs = el.dataset.k.split('.'); let o = S;
  for (let i = 0; i < segs.length - 1; i++) { const sg = segs[i]; const x = sg.indexOf('#'); o = x >= 0 ? (o[sg.slice(0, x)] || []).find(y => y.id === sg.slice(x + 1)) : o[sg]; if (!o) return false; }
  const key = segs[segs.length - 1]; const t = el.dataset.t; let v;
  if (t === 'bool') v = el.checked;
  else if (t === 'num' || t === 'pct') {
    const raw = el.value.trim();
    if (raw === '') v = null; else { v = parseNum(raw); if (!isFinite(v)) { el.classList.add('bad'); return false; } if (t === 'pct') v /= 100; }
  } else if (t === 'sel') v = el.value || null; else v = el.value;
  el.classList.remove('bad'); o[key] = v; return true;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k && el.tagName !== 'SELECT' && el.type !== 'checkbox') { if (setFrom(el)) { save(); refresh(); } }
  else if (el.dataset.u) { ui[el.dataset.u] = el.value; refresh(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.k && (el.tagName === 'SELECT' || el.type === 'checkbox')) { if (setFrom(el)) { save(); render(); } }
  else if (el.dataset.k && el.dataset.rr !== undefined) render();
  else if (el.dataset.f) { ui2[el.dataset.f] = el.value; ui2.all = false; render(); }
  else if (el.id === 'xl-file' && el.files[0]) { startExcel(el.files[0]); el.value = ''; }
});
document.addEventListener('click', e => {
  for (const d of $$('details[open]')) if (!d.contains(e.target)) d.open = false;
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b.dataset); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('details[open]').forEach(d => { d.open = false; });
  if (e.key === 'Enter' && e.target.closest && e.target.tagName === 'INPUT') {
    const tbl = e.target.closest('table.tasks, table.exps'); if (!tbl) return;
    const rows = $$('tbody tr', tbl); if (e.target.closest('tr') === rows[rows.length - 1]) { e.preventDefault(); tbl.classList.contains('tasks') ? ACT.add() : ACT.addExp(); }
  }
});
const commit = () => { save(); render(); };
const focusField = k => { const el = document.querySelector(`[data-k="${k}"]`); if (el) el.focus(); };
const ACT = {
  tab: d => { tab = d.tab; render(); window.scrollTo({ top: 0 }); },
  openWs: d => { ui.ws = d.id; tab = 'tasks'; render(); window.scrollTo({ top: 0 }); },
  wsSel: d => { ui.ws = d.id; render(); },

  wsDel: d => {
    const w = wsById(d.id); const n = S.tasks.filter(t => t.ws === w.id).length + S.expenses.filter(x => x.ws === w.id).length;
    if (!confirm(`Delete the ${w.name} worksheet${n ? ` and its ${n} line${n > 1 ? 's' : ''}` : ''}?`)) return;
    S.worksheets = S.worksheets.filter(x => x.id !== w.id); S.tasks = S.tasks.filter(t => t.ws !== w.id); S.expenses = S.expenses.filter(x => x.ws !== w.id); ui.ws = null; commit();
  },
  add: () => {
    const w = curWs(); const list = S.tasks.filter(t => t.ws === w.id); const last = list[list.length - 1];
    const t = { id: uid('t'), ws: w.id, wbs: last ? last.wbs : '', phase: last ? last.phase : '', name: '', level: last ? last.level : (S.levels.find(l => l.id !== S.settings.pmLevel) || {}).id || null, qty: 1, hours: null, notes: '', pmBase: true };
    S.tasks.push(t); tab = 'tasks'; commit(); focusField(`tasks#${t.id}.name`);
  },
  copy: d => { const i = S.tasks.findIndex(t => t.id === d.id); S.tasks.splice(i + 1, 0, { ...S.tasks[i], id: uid('t') }); commit(); },
  del: d => { S.tasks = S.tasks.filter(t => t.id !== d.id); commit(); },
  move: d => {
    const t = S.tasks.find(x => x.id === d.id); const list = S.tasks.filter(x => x.ws === t.ws); const j = list.indexOf(t) + +d.d; if (j < 0 || j >= list.length) return;
    const a = S.tasks.indexOf(t), b = S.tasks.indexOf(list[j]); [S.tasks[a], S.tasks[b]] = [S.tasks[b], S.tasks[a]]; commit();
  },
  addExp: () => { const w = curWs(); const x = { id: uid('x'), ws: w.id, sp: (S.setpoints[0] || {}).id || null, desc: (S.setpoints[0] || {}).name || '', qty: null, mult: 1, unit: null }; S.expenses.push(x); tab = 'expenses'; commit(); focusField(`expenses#${x.id}.qty`); },

  xlImport: async () => {

/* ---------- Open Excel dialog ---------- */

  const dlg = $('#xl-dialog');

  $('#xl-go').disabled = true; $('#xl-replace').hidden = !S;
  if (!dlg.open) dlg.showModal();

    const wb = await readWorkbook(await file.arrayBuffer());

      const est = normalize(await extractAppWorkbook(wb, file.name)); const r = calc(est);
      pending = { wb, name: file.name, kind: 'app' };
      $('#xl-msg').innerHTML = `<div class="preview">Saved from this app. <b>${est.worksheets.length}</b> worksheet${est.worksheets.length === 1 ? '' : 's'}, <b>${est.tasks.length}</b> tasks, <b>${est.expenses.length}</b> expenses.<br>
        ${isNum(est.source.final.price) ? `The workbook's final total is <b>${money(est.source.final.price)}</b>; this app calculates <b>${money(r.price)}</b>.` : `Final total <b>${money(r.price)}</b>.`}</div>`;
      $('#xl-go').disabled = false; return;
    }
    if (await isOrganizedWorkbook(wb)) {
      const data = await extractOrganized(wb); pending = { wb, name: file.name, kind: 'organized', data };
      $('#xl-replace').hidden = true;
      const hp = S ? S.worksheets.find(w => /hphmi|hmi/i.test(w.name)) : null;
      const opts = (S ? S.worksheets.map(w => `<option value="${w.id}"${hp && hp.id === w.id ? ' selected' : ''}>${h(w.name)}</option>`).join('') : '') + `<option value="__new"${hp ? '' : ' selected'}>New worksheet: HMI graphics</option>`;
      const rows = data.report.map(x => `<li><label class="check"><input type="checkbox" class="xl-grp" value="${x.key}"${x.on ? ' checked' : ''}> <span><b>${h(x.label)}</b>: ${x.n} line${x.n === 1 ? '' : 's'}, ${hrs1(x.hrs)} hours${isNum(x.sheet) && x.sheet > 0 && Math.abs(x.sheet - x.hrs) > 0.01 ? ` <span class="tag">(the sheet's own subtotals count ${hrs1(x.sheet)})</span>` : ''}${x.differs ? ` <span class="tag">${x.differs} with different stage hours</span>` : ''}${x.on ? '' : ' <span class="tag">calibration sample, left out by default</span>'}</span></label></li>`).join('');
      const tot = data.report.filter(x => x.on).reduce((a, x) => a + x.hrs, 0);
      const existing = hp ? S.tasks.filter(t => t.ws === hp.id) : [];
      $('#xl-msg').innerHTML = `<div class="preview">Organized workbook, scored by complexity. Tick what to bring in:<ul class="tablist checks-list">${rows}</ul><b>${hrs1(tot)}</b> hours in the ticked blocks. Hours per point and dashboard stages come from the workbook and replace those matrix rows.</div>
        <label class="field">Put the lines on<select id="xl-target">${opts}</select></label>
        <label class="check" style="margin-top:10px"><input type="checkbox" id="xl-replace-cx" checked> Replace complexity lines already on that worksheet</label>
        ${existing.length ? `<p class="hint">${h(hp.name)} already has ${existing.length} task line${existing.length === 1 ? '' : 's'} (${hrs(existing.reduce((a, t) => a + R.tasks[t.id].hrs, 0))} hours). The complexity lines add to them, so remove those tasks if the matrix replaces them.</p>` : ''}
        ${S && !S.matrix.mix.length ? '<p class="hint">Set the skill mix on the Complexity matrix tab afterwards, or open the estimator first to bring in its 20/30/50 HMI Breakdown split.</p>' : ''}`;
      $('#xl-go').disabled = false; return;
    }
    const tabs = await listEstimatorTabs(wb);
    if (!tabs.length) throw new Error('No estimating tabs found. The app reads its own saved workbooks, or estimator tabs laid out like SCADA with Task Description in column G.');
    pending = { wb, name: file.name, kind: 'estimator', tabs };
    const est = normalize(await extractEstimator(wb, file.name, tabs)); const r = calc(est); const f = est.source.final;
    $('#xl-msg').innerHTML = `<div class="preview">Estimator workbook with <b>${tabs.length}</b> estimating tab${tabs.length === 1 ? '' : 's'}:<ul class="tablist">${tabs.map(t => `<li>${h(t.name)}${t.include ? '' : ' <span class="tag">excluded on the Financial tab</span>'}</li>`).join('')}</ul>
      ${isNum(f.price) ? `Financial tab (T35): <b>${money(f.price)}</b> at <b>${pct(f.margin)}</b>, ${hrs(f.hours)} hours, approver <b>${h(f.approver || 'not shown')}</b>.<br>` : ''}
      This app calculates <b>${money(r.price)}</b> at <b>${pct(r.margin)}</b>, approver <b>${h(r.approver)}</b>.</div>
      <p class="hint">Tasks, expenses, engineer levels, rates, the expense rate list and the DOA approval matrix come across. Materials, subcontracts and time-and-materials pricing stay in the workbook for now.</p>`;
    $('#xl-go').disabled = false;
  } catch (err) { $('#xl-msg').innerHTML = `<p class="err">${h(err.message || 'Could not read this file.')}</p>`; }
}
function fileBase() { const p = S.project; return ([p.number, p.customer, p.name].filter(Boolean).join('_') || 'estimate').replace(/[^\w\-]+/g, '_').slice(0, 80); }
function downloadBlob(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- Boot ---------- */
S = load();
render();
status(S ? 'Saved in this browser' : '');

</script>
