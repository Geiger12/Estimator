<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GrayMatter Estimator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' rx='5' transform='rotate(45 16 16)' fill='%232377A2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0F4C75; --navy-2: #0C3F62; --blue: #2377A2; --sky: #8EC1DE; --orange: #F28C38;
  --ink: #333333; --muted: #67737D; --paper: #F5F5F5; --card: #FFFFFF; --rule: #DCE2E7; --rule-soft: #ECEFF2;
  --field: #FFFFFF; --field-line: #C8D1D8; --tint: #F2F7FA; --ok: #1F7A4D; --warn: #9A4A06; --warn-bg: #FFF4E8; --bad: #B42318;
  --c1: #0F4C75; --c2: #2377A2; --c3: #8EC1DE; --c4: #5E6B75; --c5: #C9D3DA; --c6: #B7D3E6;
  --head: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
  --body: "Open Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --navy: #0B3A5A; --navy-2: #092F4A; --blue: #5AA9D6; --ink: #E5EAEE; --muted: #97A5B0; --paper: #10171D; --card: #172129;
    --rule: #2A3742; --rule-soft: #212C35; --field: #0F171D; --field-line: #354552; --tint: #1A2631;
    --ok: #5BC48D; --warn: #F5B169; --warn-bg: #2A2115; --bad: #F97066;
    --c1: #5AA9D6; --c2: #8EC1DE; --c3: #2F6F98; --c4: #8C9AA5; --c5: #3A4955; --c6: #426A86;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--head); font-weight: 800; margin: 0; letter-spacing: -0.01em; }
.n { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 20; }
.top-in { display: flex; align-items: center; gap: 22px; padding: 0 32px; min-height: 64px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { height: 24px; display: block; }
.brand span { font-family: var(--head); font-weight: 800; font-size: 15px; padding-left: 14px; border-left: 1px solid rgba(255,255,255,.3); }
.tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
.tab { background: none; border: 0; color: rgba(255,255,255,.72); padding: 20px 12px 17px; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 600; white-space: nowrap; }
.tab:hover { color: #fff; }
.tab[aria-selected="true"] { color: #fff; border-bottom-color: #fff; }
.actions { display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--field-line); background: var(--card); color: var(--ink); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--blue); padding: 6px 8px; }
.btn.danger { color: var(--bad); }
.top .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
.top .btn:hover { background: rgba(255,255,255,.12); }
.top .btn.primary { background: #fff; color: var(--navy); border-color: #fff; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; right: 0; top: 40px; background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.18); padding: 6px; min-width: 240px; display: flex; flex-direction: column; z-index: 30; }
.menu .pop button { background: none; border: 0; text-align: left; padding: 9px 12px; border-radius: 5px; cursor: pointer; color: var(--ink); }
.menu .pop button:hover { background: var(--tint); }
.menu .pop hr { border: 0; border-top: 1px solid var(--rule); margin: 5px 0; }

/* Dashboard hero */
.hero { background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; padding: 26px 32px 84px; }
.hero-id h1 { font-size: 22px; }
.hero-id p { margin: 2px 0 0; color: rgba(255,255,255,.72); font-size: 13.5px; }
.hero-main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px 56px; margin-top: 22px; align-items: end; }
.price-label { font-size: 13px; color: rgba(255,255,255,.75); }
.price { display: block; font-family: var(--head); font-weight: 800; font-size: clamp(44px, 6.4vw, 76px); line-height: 1.02; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.dial { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; margin-top: 18px; max-width: 560px; }
.dial label { font-size: 13px; color: rgba(255,255,255,.75); }
.dial output { font-family: var(--head); font-weight: 800; font-size: 30px; color: var(--orange); font-variant-numeric: tabular-nums; min-width: 3.6em; }
.dial input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--orange); height: 22px; }
.dial .scale { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11.5px; color: rgba(255,255,255,.6); margin-top: -4px; }
.target { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: rgba(255,255,255,.8); }
.target input { width: 150px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 6px; padding: 6px 10px; }
.target input::placeholder { color: rgba(255,255,255,.5); }
.target b { color: #fff; }
.target .btn { padding: 4px 10px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; margin: 0; }
.kpis div { border-top: 1px solid rgba(255,255,255,.22); padding-top: 10px; }
.kpis dt { font-size: 12.5px; color: rgba(255,255,255,.72); }
.kpis dd { margin: 2px 0 0; font-family: var(--head); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }

main { padding: 24px 32px 40px; max-width: 1480px; }
.hero:not([hidden]) + main { margin-top: -64px; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; margin-bottom: 20px; }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card h2 { font-size: 16px; color: var(--navy); }
@media (prefers-color-scheme: dark) { .card h2 { color: var(--blue); } }
.card .hint { color: var(--muted); font-size: 13px; margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-bottom: 20px; }
.grid2 > .card { margin-bottom: 0; }
.build-card { box-shadow: 0 10px 30px rgba(15,76,117,.12); }

/* Price build-up */
.stack { display: flex; height: 26px; border-radius: 6px; overflow: hidden; background: var(--rule-soft); }
.stack i { display: block; height: 100%; }
.stack i + i { box-shadow: -2px 0 0 var(--card); }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 14px 20px; margin-top: 16px; }
.legend div { display: grid; grid-template-columns: 12px 1fr; gap: 2px 10px; align-items: center; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.legend span { font-size: 12.5px; color: var(--muted); }
.legend b { grid-column: 2; font-family: var(--head); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.legend .eq b { color: var(--ink); }
.legend .eq { border-left: 2px solid var(--rule); padding-left: 14px; }

/* Donut */
.donut-wrap { display: grid; grid-template-columns: 190px 1fr; gap: 24px; align-items: center; }
.donut-wrap svg { width: 190px; height: 190px; display: block; }
.donut-mid { font-family: var(--head); font-weight: 800; font-size: 26px; fill: var(--ink); }
.donut-sub { font-size: 12px; fill: var(--muted); }
.keys { display: grid; gap: 10px; }
.key { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; font-size: 13.5px; }
.key .sw { width: 12px; height: 12px; border-radius: 3px; }
.key .n { text-align: right; }
.key .p { color: var(--muted); font-size: 12.5px; width: 48px; text-align: right; }

/* Bars */
.bars { display: grid; gap: 12px; }
.bar { display: grid; grid-template-columns: minmax(110px, 250px) 1fr 64px; gap: 12px; align-items: center; font-size: 13.5px; }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .lbl small { display: block; color: var(--muted); font-size: 12px; }
.bar .track { height: 12px; background: var(--rule-soft); border-radius: 6px; overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--c2); border-radius: 6px; }
.bar .n { text-align: right; font-weight: 600; }

/* Checks */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.checks li { display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: baseline; font-size: 13.5px; }
.checks .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
.checks .dot.warn { background: var(--orange); }
.checks .dot.bad { background: var(--bad); }
.checks .dot.ok { background: var(--ok); }

/* Tables */
.scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--rule-soft); vertical-align: middle; }
table.t .r { text-align: right; }
table.t td.r { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t input, table.t select { width: 100%; border: 1px solid var(--field-line); background: var(--field); color: var(--ink); border-radius: 6px; padding: 7px 9px; min-width: 0; }
table.t input.num { text-align: right; }
table.t tfoot td { border-bottom: 0; }
table.t tr.auto td { color: var(--muted); background: var(--tint); }
table.t tr.sum td { font-weight: 700; border-top: 2px solid var(--navy); padding-top: 10px; }
@media (prefers-color-scheme: dark) { table.t tr.sum td { border-top-color: var(--blue); } }
table.t tr.phase td { font-family: var(--head); font-weight: 800; color: var(--navy); padding-top: 16px; border-bottom-color: var(--rule); }
@media (prefers-color-scheme: dark) { table.t tr.phase td { color: var(--blue); } }
table.t tr.sub td { font-weight: 600; color: var(--muted); }
table.t .big { font-family: var(--head); font-weight: 800; font-size: 16px; }
.tasks .c-phase { width: 15%; min-width: 130px; } .tasks .c-task { width: 28%; min-width: 220px; } .tasks .c-level { width: 15%; min-width: 140px; }
.tasks .c-num { width: 90px; min-width: 80px; } .tasks .c-tot { width: 100px; } .tasks .c-notes { min-width: 160px; } .tasks .c-act { width: 120px; }
.tasks td.tot { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.row-act { display: flex; gap: 2px; justify-content: flex-end; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--tint); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; }
.chip b { font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty p { margin: 0 0 14px; }

/* Forms */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 18px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--field-line); background: var(--field); color: var(--ink); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.field textarea { min-height: 72px; resize: vertical; }
.field .sfx { position: relative; }
.field .sfx input { width: 100%; padding-right: 28px; }
.field .sfx::after { content: attr(data-sfx); position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
input.bad { border-color: var(--bad) !important; }
.note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

/* Start + dialog */
.start { max-width: 660px; margin: 56px auto; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 36px; }
.start h1 { font-size: 28px; color: var(--navy); margin-bottom: 10px; }
@media (prefers-color-scheme: dark) { .start h1 { color: var(--blue); } }
.start p { margin: 0 0 12px; }
.start .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0 16px; }
.start .fine { color: var(--muted); font-size: 13px; }
dialog { border: 1px solid var(--rule); border-radius: 12px; padding: 26px; max-width: 520px; width: calc(100% - 32px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(8, 28, 44, .55); }
dialog h2 { font-size: 19px; color: var(--navy); margin-bottom: 6px; }
@media (prefers-color-scheme: dark) { dialog h2 { color: var(--blue); } }
dialog .file { color: var(--muted); font-size: 13px; margin: 0 0 16px; word-break: break-all; }
dialog .preview { background: var(--tint); border-radius: 8px; padding: 12px 14px; margin: 14px 0; font-size: 13.5px; }
dialog .preview b { font-variant-numeric: tabular-nums; }
dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
dialog .err { color: var(--bad); font-size: 13.5px; }

footer { padding: 0 32px 28px; color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
#status { font-weight: 600; }

@media (max-width: 900px) {
  .hero-main { grid-template-columns: 1fr; }
  .donut-wrap { grid-template-columns: 1fr; justify-items: center; }
  .donut-wrap .keys { width: 100%; }
}
@media (max-width: 640px) {
  .top-in, .hero, main, footer { padding-left: 16px; padding-right: 16px; }
  .top-in { gap: 8px 14px; padding-top: 10px; }
  .tabs { order: 3; flex-basis: 100%; }
  .tab { padding: 10px 10px 9px; }
  .grid2 { grid-template-columns: 1fr; }
  .kpis dd { font-size: 20px; }
}
@media print {
  .top, .toolbar, .row-act, .target, footer #status { display: none !important; }
  .hero { -webkit-print-color-adjust: exact; print-color-adjust: exact; padding-bottom: 24px; }
  .hero:not([hidden]) + main { margin-top: 0; }
  .card { break-inside: avoid; }
  table.t input, table.t select { border: 0; padding: 0; background: transparent; }
}
[hidden] { display: none !important; }
.hero[hidden] + main { margin-top: 0; }
.field small { color: var(--muted); font-size: 12px; }
.btn:disabled { opacity: .35; cursor: default; }

</style>
</head>

const XL = (() => {
  const HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

  /* Style index map (see styles() below) */
  const ST = { title: 1, head: 2, headR: 3, inText: 4, inNum: 5, inPct: 6, inMoney: 7, hrs: 8, money: 9, money0: 10, pct: 11, totHrs: 12, totMoney: 13, totLabel: 14, note: 15, bold: 16, big: 17, boldPct: 18, boldMoney: 19, boldHrs: 20, sub: 21 };

    const f = (b, sz, color, i) => `<font>${b ? '<b/>' : ''}${i ? '<i/>' : ''}<sz val="${sz}"/>${color ? `<color rgb="FF${color}"/>` : ''}<name val="Arial"/><family val="2"/></font>`;

      xf(0, 0, 0, 0), xf(0, 1, 0, 0), xf(0, 2, 2, 1, 'vertical="center"'), xf(0, 2, 2, 1, 'horizontal="right" vertical="center"'),
      xf(49, 3, 0, 0), xf(0, 3, 0, 0), xf(166, 3, 0, 0), xf(164, 3, 0, 0),
      xf(167, 0, 0, 0), xf(164, 0, 0, 0), xf(165, 0, 0, 0), xf(166, 0, 0, 0),
      xf(167, 2, 0, 2), xf(165, 2, 0, 2), xf(0, 2, 0, 2), xf(0, 4, 0, 0),

<numFmts count="4"><numFmt numFmtId="164" formatCode="&quot;$&quot;#,##0.00"/><numFmt numFmtId="165" formatCode="&quot;$&quot;#,##0"/><numFmt numFmtId="166" formatCode="0.0%"/><numFmt numFmtId="167" formatCode="#,##0"/></numFmts>
<fonts count="7">${f(0, 10)}${f(1, 14, '0F4C75')}${f(1, 10)}${f(0, 10, '0000FF')}${f(0, 9, '666666', 1)}${f(1, 18, '0F4C75')}${f(0, 10, '666666')}</fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8F1F7"/><bgColor indexed="64"/></patternFill></fill></fills>

  /* A sheet is a map of cell refs: { s: style, str | n | f, cv: cached value } */
  function cellXml(ref, c) {
    const s = c.s ? ` s="${c.s}"` : '';

      if (typeof c.cv === 'number' && isFinite(c.cv)) return `<c r="${ref}"${s}>${f}<v>${c.cv}</v></c>`;

  }

    for (const ref of Object.keys(sh.cells)) (rows[rowN(ref)] = rows[rowN(ref)] || []).push(ref);
    const data = Object.keys(rows).map(Number).sort((a, b) => a - b).map(r => {
      const cells = rows[r].sort((a, b) => colN(a) - colN(b)).map(ref => cellXml(ref, sh.cells[ref])).join('');
      const ht = sh.heights && sh.heights[r] ? ` ht="${sh.heights[r]}" customHeight="1"` : '';
      return `<row r="${r}"${ht}>${cells}</row>`;
    }).join('');
    const pane = sh.freeze ? `<pane ySplit="${sh.freeze - 1}" topLeftCell="A${sh.freeze}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A${sh.freeze}" sqref="A${sh.freeze}"/>` : '';
    const cols = sh.widths ? `<cols>${sh.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
    const dv = sh.lists && sh.lists.length ? `<dataValidations count="${sh.lists.length}">${sh.lists.map(([sq, src]) => `<dataValidation type="list" allowBlank="1" showErrorMessage="1" errorTitle="Not in the list" error="Pick a level from the Rates tab, or add it there first." sqref="${sq}"><formula1>${xe(src)}</formula1></dataValidation>`).join('')}</dataValidations>` : '';
    return HEAD + `<worksheet ${NS}>${sh.fit ? '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' : ''}<sheetViews><sheetView workbookViewId="0"${sh.selected ? ' tabSelected="1"' : ''} showGridLines="${sh.grid ? 1 : 0}">${pane}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${data}</sheetData>${dv}<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
  }

  /* ---------- Zip (stored entries; Excel reads these fine) ---------- */
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(files) {
    const enc = new TextEncoder(); const d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const parts = []; const central = []; let offset = 0;

      const nm = enc.encode(name); const data = enc.encode(text); const crc = crc32(data);

      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), nm, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, nm.length, true); ch.setUint32(42, offset, true);

    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);

    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    files.push(['docProps/core.xml', HEAD + `<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xe(title)}</dc:title><dc:creator>GrayMatter Estimator</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`]);
    files.push(['docProps/app.xml', HEAD + `<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>GrayMatter Estimator</Application></Properties>`]);
    files.push(['xl/workbook.xml', HEAD + `<workbook ${NS}><bookViews><workbookView activeTab="0"/></bookViews><sheets>${sheets.map((s, i) => `<sheet name="${xe(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets><definedNames>${names.map(([n, ref]) => `<definedName name="${n}">${xe(ref)}</definedName>`).join('')}</definedNames><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`]);
    files.push(['xl/_rels/workbook.xml.rels', HEAD + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`]);

/* Layout of the saved workbook. The reader below depends on these positions. */
const XLL = { tasksHead: 4, task0: 5, extraTasks: 60, level0: 12, extraLevels: 10 };

function buildEstimateWorkbook(est, res) {
  const T = XL.ST; const levelName = id => ((est.levels.find(l => l.id === id) || {}).name || '');
  const nT = est.tasks.length, nL = est.levels.length;
  const t0 = XLL.task0, tLast = t0 + nT + XLL.extraTasks - 1;
  const l0 = XLL.level0, lLast = l0 + nL + XLL.extraLevels - 1;
  const s = est.settings, p = est.project, m = num(s.margin), e = num(s.escPct);
  const gross = c => (m < 1 ? c * (1 + e) / (1 - m) : 0);

  // Rates and settings
  const rates = { name: 'Rates', widths: [44, 18, 16, 4, 18, 44], cells: {}, heights: { 1: 24 }, fit: true };
  const rc = rates.cells;
  rc.A1 = { s: T.title, str: 'Rates and settings' };
  rc.A2 = { s: T.note, str: 'Blue cells are inputs. Change them here or in the Estimator app; every tab recalculates. To add an engineer level, type it in an empty row of the levels table, then pick it on the Tasks tab.' };
  [['Margin', 'margin'], ['Project management, share of task hours', 'pmPct'], ['Contingency, share of task and PM', 'contPct'], ['Escalation', 'escPct']]
    .forEach(([label, k], i) => { rc['A' + (4 + i)] = { s: T.bold, str: label }; rc['B' + (4 + i)] = { s: T.inPct, n: num(s[k]) }; });
  rc.A8 = { s: T.bold, str: 'PM charged at (level)' }; rc.B8 = { s: T.inText, str: levelName(s.pmLevel) };
  [['Project name', 'name'], ['Customer', 'customer'], ['Proposal number', 'number'], ['Revision', 'rev'], ['Prepared by', 'preparedBy'], ['Notes', 'notes']]
    .forEach(([label, k], i) => { rc['E' + (4 + i)] = { s: T.bold, str: label }; rc['F' + (4 + i)] = { s: T.inText, str: p[k] || '' }; });
  rc.A11 = { s: T.head, str: 'Level' }; rc.B11 = { s: T.head, str: 'Role code' }; rc.C11 = { s: T.headR, str: 'Cost per hour' };
  for (let i = 0; i < nL + XLL.extraLevels; i++) {
    const L = est.levels[i]; const r = l0 + i;
    rc['A' + r] = { s: T.inText, str: L ? L.name : '' }; rc['B' + r] = { s: T.inText, str: L ? L.code : '' };
    rc['C' + r] = L && isNum(L.cost) ? { s: T.inMoney, n: L.cost } : { s: T.inMoney };
  }
  rates.lists = [['B8', 'LevelNames']];

  // Tasks
  const tasks = { name: 'Tasks', widths: [18, 42, 18, 11, 11, 12, 14, 14, 14, 34], cells: {}, freeze: t0, heights: { 1: 24, 4: 22 }, fit: true };
  const tc = tasks.cells;
  tc.A1 = { s: T.title, str: 'Tasks' };
  tc.A2 = { s: T.note, str: 'Blue cells are inputs. Total hours = quantity × hours each, rounded up. Use the empty rows below to add tasks; formulas are already in place.' };
  const head = ['Phase', 'Task', 'Engineer level', 'Quantity', 'Hours each', 'Total hours', 'Rate per hour', 'Cost', 'Price', 'Notes'];
  head.forEach((hd, i) => { tc[String.fromCharCode(65 + i) + XLL.tasksHead] = { s: i >= 3 && i <= 8 ? T.headR : T.head, str: hd }; });
  let sumPrice = 0;
  for (let i = 0; i < nT + XLL.extraTasks; i++) {
    const t = est.tasks[i]; const r = t0 + i; const tr = t ? res.tasks[t.id] : null;
    tc['A' + r] = { s: T.inText, str: t ? t.phase : '' }; tc['B' + r] = { s: T.inText, str: t ? t.name : '' };
    tc['C' + r] = { s: T.inText, str: t ? levelName(t.level) : '' };
    tc['D' + r] = t && isNum(t.qty) ? { s: T.inNum, n: t.qty } : { s: T.inNum };
    tc['E' + r] = t && isNum(t.hours) ? { s: T.inNum, n: t.hours } : { s: T.inNum };
    const live = !!t && ((t.name || '') + (isNum(t.qty) ? t.qty : '') + (isNum(t.hours) ? t.hours : '')) !== '';
    const price = live ? gross(tr.cost) : '';
    if (live) sumPrice += price;
    tc['F' + r] = { s: T.hrs, f: `IF(B${r}&D${r}&E${r}="","",ROUNDUP(N(D${r})*N(E${r}),0))`, cv: live ? tr.hrs : '' };
    tc['G' + r] = { s: T.money, f: `IF(F${r}="","",IFERROR(VLOOKUP(C${r},Levels,3,FALSE),0))`, cv: live ? tr.rate : '' };
    tc['H' + r] = { s: T.money, f: `IF(F${r}="","",F${r}*G${r})`, cv: live ? tr.cost : '' };
    tc['I' + r] = { s: T.money, f: `IF(F${r}="","",H${r}*(1+Escalation)/(1-Margin))`, cv: price };
    tc['J' + r] = { s: T.inText, str: t ? t.notes || '' : '' };
  }
  tc.E3 = { s: T.bold, str: 'Totals' };
  tc.F3 = { s: T.boldHrs, f: `SUM(F${t0}:F${tLast})`, cv: res.taskHrs };
  tc.H3 = { s: T.boldMoney, f: `SUM(H${t0}:H${tLast})`, cv: res.taskCost };
  tc.I3 = { s: T.boldMoney, f: `SUM(I${t0}:I${tLast})`, cv: sumPrice };
  tasks.lists = [[`C${t0}:C${tLast}`, 'LevelNames']];

  // Summary
  const sum = { name: 'Summary', widths: [40, 14, 24, 16, 18], cells: {}, selected: true, heights: { 1: 24, 4: 30 }, fit: true };
  const sc = sum.cells; const TR = c => `Tasks!$${c}$${t0}:$${c}$${tLast}`;
  const ident = [p.customer, p.number ? `Proposal ${p.number}${p.rev !== '' && p.rev != null ? ` rev ${p.rev}` : ''}` : ''].filter(Boolean).join(', ');
  sc.A1 = { s: T.title, f: 'IF(Rates!F4="","Estimate",Rates!F4)', cv: p.name || 'Estimate' };
  sc.A2 = { s: T.sub, f: 'IF(Rates!F5="","",Rates!F5&IF(Rates!F6="","",", "))&IF(Rates!F6="","","Proposal "&Rates!F6&IF(Rates!F7="",""," rev "&Rates!F7))', cv: ident };
  sc.A3 = { s: T.note, str: 'Calculated from the Tasks and Rates tabs. Draft estimate: a qualified person reviews hours, rates and margin before anything is sent.' };
  sc.A4 = { s: T.bold, str: 'Fixed price' }; sc.B4 = { s: T.big, f: 'D13', cv: res.price };
  sc.A5 = { s: T.bold, str: 'Margin' }; sc.B5 = { s: T.boldPct, f: 'D15', cv: res.margin || 0 };
  sc.A6 = { s: T.bold, str: 'Total hours' }; sc.B6 = { s: T.boldHrs, f: 'B13', cv: res.hrs };
  ['Item', 'Hours', 'Cost before escalation', 'Price'].forEach((hd, i) => { sc[String.fromCharCode(65 + i) + 8] = { s: i ? T.headR : T.head, str: hd }; });
  const row = (r, label, b, c, d) => { sc['A' + r] = { str: label }; if (b) sc['B' + r] = b; if (c) sc['C' + r] = c; if (d) sc['D' + r] = d; };
  row(9, 'Task labor', { s: T.hrs, f: `SUM(${TR('F')})`, cv: res.taskHrs }, { s: T.money0, f: `SUM(${TR('H')})`, cv: res.taskCost }, { s: T.money0, f: `SUM(${TR('I')})`, cv: sumPrice });
  row(10, 'Project management', { s: T.hrs, f: 'ROUNDUP(PM_Pct*B9,0)', cv: res.pm.hrs }, { s: T.money0, f: 'B10*IFERROR(VLOOKUP(PM_Level,Levels,3,FALSE),0)', cv: res.pm.cost }, { s: T.money0, f: 'C10*(1+Escalation)/(1-Margin)', cv: gross(res.pm.cost) });
  row(11, 'Contingency', { s: T.hrs, f: 'ROUNDDOWN(Contingency_Pct*(B9+B10),0)', cv: res.cont.hrs }, { s: T.money0, f: 'Contingency_Pct*(C9+C10)', cv: res.cont.cost }, { s: T.money0, f: 'C11*(1+Escalation)/(1-Margin)', cv: gross(res.cont.cost) });
  row(12, 'Escalation (included in prices)', null, { s: T.money0, f: 'SUM(C9:C11)*Escalation', cv: res.esc }, null);
  sc.A13 = { s: T.totLabel, str: 'Total' }; sc.B13 = { s: T.totHrs, f: 'SUM(B9:B11)', cv: res.hrs }; sc.C13 = { s: T.totMoney, f: 'SUM(C9:C12)', cv: res.cost }; sc.D13 = { s: T.totMoney, f: 'SUM(D9:D11)', cv: res.price };
  row(14, 'Gross profit', null, null, { s: T.money0, f: 'D13-C13', cv: res.gp });
  row(15, 'Margin', null, null, { s: T.pct, f: 'IF(D13=0,0,D14/D13)', cv: res.margin || 0 });
  row(16, 'Average price per hour', null, null, { s: T.money, f: 'IF(B13=0,0,D13/B13)', cv: res.perHr || 0 });
  ['Engineer level', 'Hours', 'Cost before escalation', 'Price', 'Share of all hours'].forEach((hd, i) => { sc[String.fromCharCode(65 + i) + 18] = { s: i ? T.headR : T.head, str: hd }; });
  let r = 19;
  for (let i = 0; i < nL + XLL.extraLevels; i++, r++) {
    const L = est.levels[i]; const rr = l0 + i;

  for (const el of $$('[data-dyn]')) { const fn = DYN[el.dataset.dyn]; if (fn) el.innerHTML = fn(el.dataset.arg); }
  const slider = $('#margin-range'); if (slider && document.activeElement !== slider) slider.value = (num(S.settings.margin) * 100).toFixed(1);
  document.title = (S.project.name ? S.project.name + ' | ' : '') + 'GrayMatter Estimator';
}
function renderTop() {
  const t = (id, label) => `<button class="tab" role="tab" aria-selected="${tab === id}" data-act="tab" data-tab="${id}">${label}</button>`;
  $('#tabs').innerHTML = S ? t('dashboard', 'Dashboard') + t('tasks', 'Tasks') + t('breakdown', 'Price breakdown') + t('settings', 'Rates and settings') : '';
  $('#actions').innerHTML = S
    ? `<button class="btn" data-act="pickExcel">Open Excel</button><button class="btn primary" data-act="saveExcel">Save as Excel</button>
       <details class="menu"><summary class="btn">More</summary><div class="pop">
         <button data-act="print">Print this page</button><hr>
         <button data-act="blank">Start a blank estimate</button><button data-act="clear">Remove estimate from this browser</button></div></details>`
    : `<button class="btn primary" data-act="pickExcel">Open Excel</button>`;
}

/* ---------- Start ---------- */
function startView() {
  return `<div class="start">
    <h1>Start an estimate</h1>
    <p>Open an Excel workbook to begin. That can be your estimate tool (.xlsm), where the app pulls the tasks, engineer levels, hours and rates from the SCADA tab, or a workbook you saved from this app.</p>
    <div class="row"><button class="btn primary" data-act="pickExcel">Open Excel workbook</button><button class="btn" data-act="blank">Start blank</button></div>
    <p class="fine">Save as Excel writes a normal .xlsx with working formulas, so you can keep editing in Excel and open it here again. Workbooks are read inside this browser and never uploaded. This page holds no rates or client details until you open a file.</p>
  </div>`;
}

/* ---------- Dashboard ---------- */
function heroView() {
  const p = S.project;
  const sub = [p.customer, p.number ? `Proposal ${p.number}${p.rev !== '' ? ` rev ${p.rev}` : ''}` : '', S.source && S.source.kind !== 'app' ? `from the ${S.source.sheet} tab` : ''].filter(Boolean).join(', ');
  return `<div class="hero-id"><h1>${h(p.name || 'Untitled estimate')}</h1>${sub ? `<p>${h(sub)}</p>` : ''}</div>
  <div class="hero-main">
    <div>
      <span class="price-label">Fixed price</span>
      <b class="price" data-o="price|m0"></b>
      <div class="dial">
        <label for="margin-range">Margin</label><output data-o="margin|p" for="margin-range"></output>
        <input id="margin-range" type="range" min="0" max="85" step="0.5" data-k="settings.margin" data-t="pct" value="${(num(S.settings.margin) * 100).toFixed(1)}" aria-label="Margin percent">
        <div class="scale"><span>0%</span><span>20%</span><span>40%</span><span>60%</span><span>85%</span></div>
      </div>
      <div class="target"><label for="target-in">Need a specific price?</label><input id="target-in" inputmode="decimal" data-u="target" placeholder="$ target price" value="${h(ui.target)}"><span data-dyn="target"></span></div>
    </div>
    <dl class="kpis">
      <div><dt>Total hours</dt><dd data-o="hrs|h"></dd></div>
      <div><dt>Total cost</dt><dd data-o="cost|m0"></dd></div>
      <div><dt>Gross profit</dt><dd data-o="gp|m0"></dd></div>
      <div><dt>Average price per hour</dt><dd data-o="perHr|m2"></dd></div>
    </dl>
  </div>`;
}
DYN.target = () => {
  const raw = String(ui.target || '').trim(); if (!raw) return '';
  const v = parseNum(raw); if (!isFinite(v) || v <= 0) return 'Enter a dollar amount.';
  if (v <= R.cost) return `That is below cost (${money(R.cost)}).`;
  const m = 1 - R.cost / v;
  return `needs a <b>${pct(m, 2)}</b> margin <button class="btn" data-act="useMargin" data-m="${m}">Use it</button>`;
};
function dashboardView() {
  if (!S.tasks.length) return `<section class="card build-card"><div class="empty"><p>No tasks yet. Add them on the Tasks tab or import your workbook.</p><button class="btn primary" data-act="tab" data-tab="tasks">Add tasks</button></div></section>`;
  return `<section class="card build-card"><header><h2>How the price builds up</h2><p class="hint">Cost of each piece, then the margin on top.</p></header><div data-dyn="build"></div></section>
  <div class="grid2">
    <section class="card"><header><h2>Hours by engineer level</h2></header><div data-dyn="donut"></div></section>
    <section class="card"><header><h2>Hours by phase</h2></header><div data-dyn="phases"></div></section>
  </div>
  <div class="grid2">
    <section class="card"><header><h2>Largest tasks</h2><button class="btn ghost" data-act="tab" data-tab="tasks">Edit tasks</button></header><div data-dyn="top"></div></section>
    <section class="card"><header><h2>Checks</h2></header><div data-dyn="checks"></div></section>
  </div>`;
}
const LEVEL_COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c6)', 'var(--c5)'];
DYN.build = () => {
  const parts = [
    ['Task labor', R.taskCost, 'var(--c1)'], ['Project management', R.pm.cost, 'var(--c2)'],
    ['Contingency', R.cont.cost, 'var(--c3)'], ['Escalation', R.esc, 'var(--c4)'], ['Gross profit', R.gp, 'var(--orange)']
  ].filter(p => p[1] > 0.005);
  const total = R.price || 0;
  if (!(total > 0)) return '<p class="hint">Enter rates on the Rates and settings tab to see the price.</p>';
  return `<div class="stack" role="img" aria-label="Price build-up">${parts.map(p => `<i style="width:${(p[1] / total * 100).toFixed(3)}%;background:${p[2]}" title="${h(p[0])} ${money(p[1])}"></i>`).join('')}</div>
    <div class="legend">${parts.map(p => `<div><i class="sw" style="background:${p[2]}"></i><span>${h(p[0])}</span><b>${money(p[1])}</b></div>`).join('')}
    <div class="eq"><i class="sw" style="background:transparent"></i><span>Fixed price</span><b>${money(R.price)}</b></div></div>`;
};
DYN.donut = () => {
  const rows = R.byLevel.filter(x => x.hrs > 0); const total = rows.reduce((s, x) => s + x.hrs, 0);
  if (!total) return '<p class="hint">No hours yet.</p>';
  const r = 70, C = 2 * Math.PI * r; let acc = 0;
  const segs = rows.map((x, i) => {
    const len = x.hrs / total * C; const col = x.id === '_cont' ? 'var(--c5)' : LEVEL_COLORS[i % LEVEL_COLORS.length];
    const s = `<circle r="${r}" cx="95" cy="95" fill="none" stroke="${col}" stroke-width="26" stroke-dasharray="${Math.max(len - 1.5, 0.5)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 95 95)"><title>${h(x.name)} ${hrs(x.hrs)} hrs</title></circle>`;
    acc += len; x.col = col; return s;
  }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 190 190" role="img" aria-label="Hours by engineer level">${segs}
      <text x="95" y="96" text-anchor="middle" class="donut-mid">${hrs(total)}</text><text x="95" y="116" text-anchor="middle" class="donut-sub">hours</text></svg>
    <div class="keys">${rows.map(x => `<div class="key"><i class="sw" style="background:${x.col}"></i><span>${h(x.name)}</span><span class="n">${hrs(x.hrs)} hrs</span><span class="p">${pct(x.hrs / total, 0)}</span></div>`).join('')}</div></div>`;
};
DYN.phases = () => {
  const rows = R.byPhase.filter(x => x.hrs > 0); const max = Math.max(1, ...rows.map(x => x.hrs));
  if (!rows.length) return '<p class="hint">No hours yet.</p>';
  return `<div class="bars">${rows.map(x => `<div class="bar"><span class="lbl" title="${h(x.phase)}">${h(x.phase)}<small>${x.n} task${x.n === 1 ? '' : 's'}, ${money(x.price)}</small></span><span class="track"><i style="width:${(x.hrs / max * 100).toFixed(2)}%"></i></span><span class="n">${hrs(x.hrs)}</span></div>`).join('')}</div>`;
};
DYN.top = () => {
  const rows = S.tasks.map(t => ({ t, r: R.tasks[t.id] })).filter(x => x.r.hrs > 0).sort((a, b) => b.r.hrs - a.r.hrs).slice(0, 6);
  if (!rows.length) return '<p class="hint">No hours yet.</p>';
  const max = rows[0].r.hrs;
  return `<div class="bars">${rows.map(({ t, r }) => `<div class="bar"><span class="lbl" title="${h(t.name)}">${h(t.name || 'Untitled task')}<small>${h((levelById(t.level) || {}).name || 'No level')}, ${numIn(t.qty) || 0} × ${numIn(t.hours) || 0} hrs</small></span><span class="track"><i style="width:${(r.hrs / max * 100).toFixed(2)}%;background:var(--c1)"></i></span><span class="n">${hrs(r.hrs)}</span></div>`).join('')}</div>`;
};
function checks() {
  const c = [];
  const src = S.source;
  if (src && src.kind === 'app' && isNum(src.price)) {
    const diff = R.price - src.price;
    if (Math.abs(diff) < 1) c.push(['ok', `Matches the Summary tab of ${h(src.file)}: ${hrs(src.hours)} hours, ${money(src.price)}.`]);
    else c.push(['warn', `The Summary tab of ${h(src.file)} shows ${money(src.price)}. This estimate is ${money(R.price)}, ${diff > 0 ? 'up' : 'down'} ${money(Math.abs(diff))}, from edits made here or formulas changed in Excel. Save as Excel to bring the file up to date.`]);
  } else if (src && isNum(src.price)) {
    const diff = R.price - src.price;
    if (Math.abs(diff) < 1) c.push(['ok', `Matches the ${h(src.sheet)} tab of the workbook: ${hrs(src.hours)} hours, ${money(src.price)}.`]);
    else {
      let why = '';
      if (isNum(src.pmBase) && src.pmBase !== R.taskHrs && !src.absorbedPM) why = ` One known reason: the workbook's PM formula counts ${hrs(src.pmBase)} of the ${hrs(R.taskHrs)} task hours, which gives it ${hrs(src.pmHours)} PM hours instead of ${hrs(R.pm.hrs)}. This page counts every task.`;
      if (src.absorbedPM) why = ' The workbook absorbs PM (cost only, not priced). This page prices PM.';
      c.push(['warn', `The ${h(src.sheet)} tab shows ${money(src.price)} for ${hrs(src.hours)} hours. This estimate is ${money(R.price)}, ${diff > 0 ? 'up' : 'down'} ${money(Math.abs(diff))}.${why} Edits made here since the import also change the total.`]);
    }
  }
  const zero = S.levels.filter(l => !num(l.cost) && S.tasks.some(t => t.level === l.id));
  if (zero.length) c.push(['bad', `${zero.map(l => h(l.name)).join(', ')} ${zero.length > 1 ? 'have' : 'has'} a $0 rate. Set it on the Rates and settings tab.`]);
  const noLevel = S.tasks.filter(t => R.tasks[t.id].hrs > 0 && !levelById(t.level)).length;
  if (noLevel) c.push(['bad', `${noLevel} task${noLevel > 1 ? 's have' : ' has'} hours but no engineer level.`]);
  const noHours = S.tasks.filter(t => !R.tasks[t.id].hrs).length;
  if (noHours) c.push(['warn', `${noHours} task${noHours > 1 ? 's have' : ' has'} no hours yet.`]);
  if (num(S.settings.margin) >= 1) c.push(['bad', 'A margin of 100% or more cannot be priced.']);
  else if (!num(S.settings.margin)) c.push(['warn', 'Margin is 0%, so the price equals cost.']);
  c.push(['info', 'Draft estimate. A qualified person reviews hours, rates and margin before the price is sent.']);
  return c;
}
DYN.checks = () => `<ul class="checks">${checks().map(([s, m]) => `<li><i class="dot ${s}"></i><span>${m}</span></li>`).join('')}</ul>`;

/* ---------- Price breakdown ---------- */
function breakdownView() {
  let body = '';
  const groups = {}; const order = [];
  S.tasks.forEach(t => { const p = (t.phase || '').trim() || 'No phase'; if (!groups[p]) { groups[p] = []; order.push(p); } groups[p].push(t); });
  for (const p of order) {
    body += `<tr class="phase"><td colspan="6">${h(p)}</td></tr>`;
    for (const t of groups[p]) {
      const r = `tasks.${t.id}`;
      body += `<tr><td>${h(t.name || 'Untitled task')}</td><td>${h((levelById(t.level) || {}).name || 'No level')}</td><td class="r" data-o="${r}.hrs|h"></td><td class="r" data-o="${r}.rate|m2"></td><td class="r" data-o="${r}.cost|m0"></td><td class="r" data-o="${r}.price|m0"></td></tr>`;
    }
    const ph = R.byPhase.find(x => x.phase === p) || {};
    body += `<tr class="sub"><td colspan="2">${h(p)} subtotal</td><td class="r">${hrs(ph.hrs)}</td><td></td><td class="r">${money(ph.cost)}</td><td class="r">${money(ph.price)}</td></tr>`;
  }
  const lv = R.byLevel;
  return `<section class="card"><header><div><h2>Price breakdown</h2><p class="hint">Cost is hours × rate. Price adds escalation (${pct(R.e, 2)}) and divides by (1 − margin).</p></div></header>
    <div class="scroll"><table class="t"><thead><tr><th>Task</th><th>Level</th><th class="r">Hours</th><th class="r">Rate</th><th class="r">Cost</th><th class="r">Price</th></tr></thead>
    <tbody>${body}
      <tr class="phase"><td colspan="6">Added to every estimate</td></tr>
      <tr><td>Project management, ${pct(R.pm.pct)} of task hours</td><td>${h(R.pm.name)}</td><td class="r" data-o="pm.hrs|h"></td><td class="r" data-o="pm.rate|m2"></td><td class="r" data-o="pm.cost|m0"></td><td class="r" data-o="pm.price|m0"></td></tr>
      <tr><td>Contingency, ${pct(R.cont.pct)} of task and PM cost</td><td>Blended</td><td class="r" data-o="cont.hrs|h"></td><td></td><td class="r" data-o="cont.cost|m0"></td><td class="r" data-o="cont.price|m0"></td></tr>
      <tr><td>Escalation, ${pct(R.e, 2)} of cost</td><td></td><td></td><td></td><td class="r" data-o="esc|m0"></td><td class="r">included above</td></tr>
    </tbody>
    <tfoot><tr class="sum"><td colspan="2">Total</td><td class="r" data-o="hrs|h"></td><td></td><td class="r" data-o="cost|m0"></td><td class="r big" data-o="price|m0"></td></tr>
      <tr><td colspan="4">Gross profit and margin</td><td class="r" data-o="gp|m0"></td><td class="r" data-o="margin|p"></td></tr></tfoot></table></div></section>
  <section class="card"><header><h2>By engineer level</h2></header><div class="scroll"><table class="t">
    <thead><tr><th>Level</th><th class="r">Hours</th><th class="r">Share of hours</th><th class="r">Cost</th><th class="r">Price</th><th class="r">Price per hour</th></tr></thead>
    <tbody>${lv.map(x => `<tr><td>${h(x.name)}</td><td class="r">${hrs(x.hrs)}</td><td class="r">${pct(R.hrs ? x.hrs / R.hrs : null)}</td><td class="r">${money(x.cost * (1 + R.e))}</td><td class="r">${money(x.price)}</td><td class="r">${x.hrs ? money(x.price / x.hrs, 2) : '—'}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">Cost in this table includes escalation.</p></section>`;
}

/* ---------- Events ---------- */
function setFrom(el) {
  const segs = el.dataset.k.split('.'); let o = S;
  for (let i = 0; i < segs.length - 1; i++) { const sg = segs[i]; const x = sg.indexOf('#'); o = x >= 0 ? (o[sg.slice(0, x)] || []).find(y => y.id === sg.slice(x + 1)) : o[sg]; if (!o) return false; }
  const key = segs[segs.length - 1]; const t = el.dataset.t; let v;
  if (t === 'num' || t === 'pct') {
    const raw = el.value.trim();
    if (raw === '') v = null; else { v = parseNum(raw); if (!isFinite(v)) { el.classList.add('bad'); return false; } if (t === 'pct') v /= 100; }
  } else if (t === 'sel') v = el.value || null; else v = el.value;
  el.classList.remove('bad'); o[key] = v; return true;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k && el.tagName !== 'SELECT') { if (setFrom(el)) { save(); refresh(); } }
  else if (el.dataset.u) { ui[el.dataset.u] = el.value; refresh(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.k && el.tagName === 'SELECT') { if (setFrom(el)) { save(); render(); } }
  else if (el.dataset.k && el.dataset.rr !== undefined) render();
  else if (el.id === 'xl-file' && el.files[0]) { startExcel(el.files[0]); el.value = ''; }
  else if (el.id === 'xl-tab') previewTab();
});
document.addEventListener('click', e => {
  for (const d of $$('details[open]')) if (!d.contains(e.target)) d.open = false;
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b.dataset); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('details[open]').forEach(d => { d.open = false; });
  if (e.key === 'Enter' && e.target.closest && e.target.closest('table.tasks') && e.target.tagName === 'INPUT') {
    const rows = $$('table.tasks tbody tr'); const tr = e.target.closest('tr');
    if (tr === rows[rows.length - 1]) { e.preventDefault(); ACT.add(); }
  }
});
const commit = () => { save(); render(); };
const ACT = {
  tab: d => { tab = d.tab; render(); window.scrollTo({ top: 0 }); },
  add: () => {
    const last = S.tasks[S.tasks.length - 1];
    const t = { id: uid('t'), wbs: last ? last.wbs : '', phase: last ? last.phase : '', name: '', level: last ? last.level : (S.levels.find(l => l.id !== S.settings.pmLevel) || {}).id || null, qty: 1, hours: null, notes: '' };
    S.tasks.push(t); if (tab !== 'tasks') tab = 'tasks'; commit();
    const el = document.querySelector(`[data-k="tasks#${t.id}.name"]`); if (el) el.focus();
  },
  copy: d => { const i = S.tasks.findIndex(t => t.id === d.id); S.tasks.splice(i + 1, 0, { ...S.tasks[i], id: uid('t') }); commit(); },
  del: d => { S.tasks = S.tasks.filter(t => t.id !== d.id); commit(); },
  move: d => { const i = S.tasks.findIndex(t => t.id === d.id); const j = i + +d.d; if (j < 0 || j >= S.tasks.length) return; [S.tasks[i], S.tasks[j]] = [S.tasks[j], S.tasks[i]]; commit(); },
  addLevel: () => { S.levels.push({ id: uid('L'), name: 'New level', code: '', cost: 0 }); commit(); },
  delLevel: d => { S.levels = S.levels.filter(l => l.id !== d.id); commit(); },
  useMargin: d => { S.settings.margin = +(+d.m).toFixed(6); ui.target = ''; commit(); },
  pickExcel: () => $('#xl-file').click(),
  saveExcel: () => {
    try { downloadBlob(fileBase() + '.xlsx', buildEstimateWorkbook(S, R)); status('Saved as Excel'); }
    catch (err) { alert('Could not build the Excel file. ' + (err.message || '')); }
  },
  print: () => window.print(),
  blank: () => { if (S && !confirm('Start a blank estimate? The current one will be removed from this browser. Save a file first if you need it.')) return; S = blankEstimate(); tab = 'settings'; commit(); },
  clear: () => { if (!confirm('Remove this estimate from this browser? Save a file first if you need it.')) return; S = null; saveNow(); tab = 'dashboard'; render(); },
  xlImport: async () => {
    const tabName = $('#xl-tab').value;
    try {
      const est = normalize(pending.kind === 'app' ? await extractAppWorkbook(pending.wb, pending.name) : await extractTab(pending.wb, tabName, pending.name));
      S = est; tab = 'dashboard'; ui.target = ''; $('#xl-dialog').close(); commit();
      status(pending.kind === 'app' ? `Opened ${pending.name}` : `Imported the ${tabName} tab`);
    } catch (err) { $('#xl-msg').innerHTML = `<p class="err">${h(err.message)}</p>`; }
  },
  xlCancel: () => $('#xl-dialog').close()
};

/* ---------- Excel import dialog ---------- */
let pending = null;
async function startExcel(file) {
  const dlg = $('#xl-dialog');
  $('#xl-name').textContent = file.name; $('#xl-msg').innerHTML = '<p class="hint">Reading the workbook…</p>';
  $('#xl-tab').innerHTML = ''; $('#xl-go').disabled = true; $('#xl-replace').hidden = !S; $('#xl-tab-field').hidden = false;
  if (!dlg.open) dlg.showModal();
  try {
    const wb = await readWorkbook(await file.arrayBuffer());
    if (await isAppWorkbook(wb)) {
      pending = { wb, name: file.name, kind: 'app' }; $('#xl-tab-field').hidden = true;
      const est = await extractAppWorkbook(wb, file.name); const r = calc(est);
      $('#xl-msg').innerHTML = `<div class="preview">Saved from this app. <b>${est.tasks.length}</b> tasks, <b>${hrs(r.hrs)}</b> hours, <b>${est.levels.length}</b> engineer levels.<br>
        ${isNum(est.source.price) ? `The Summary tab shows <b>${money(est.source.price)}</b>.` : ''}</div>`;
      $('#xl-go').disabled = false; return;
    }
    const tabs = [];
    for (const s of wb.sheets) { if (s.state !== 'visible') continue; if (isEstimateTab(await wb.sheet(s.name))) tabs.push(s.name); }
    if (!tabs.length) throw new Error('No estimate tabs found. The app reads its own saved workbooks, or estimator tabs laid out like SCADA with Task Description in column G.');
    pending = { wb, name: file.name, kind: 'estimator' };
    $('#xl-tab').innerHTML = tabs.map(t => `<option${t === 'SCADA' ? ' selected' : ''}>${h(t)}</option>`).join('');
    await previewTab();
  } catch (err) { $('#xl-msg').innerHTML = `<p class="err">${h(err.message || 'Could not read this file.')}</p>`; }
}
async function previewTab() {
  const name = $('#xl-tab').value; if (!pending || !name) return;
  try {
    const est = await extractTab(pending.wb, name, pending.name);
    const r = calc(est); const src = est.source;
    const levels = [...new Set(est.tasks.map(t => (est.levels.find(l => l.id === t.level) || {}).name).filter(Boolean))];
    $('#xl-msg').innerHTML = `<div class="preview"><b>${est.tasks.length}</b> tasks, <b>${hrs(r.taskHrs)}</b> task hours${levels.length ? ` (${h(levels.join(', '))})` : ''}.<br>
      Margin <b>${pct(est.settings.margin)}</b>, PM <b>${pct(est.settings.pmPct)}</b>, contingency <b>${pct(est.settings.contPct)}</b>, escalation <b>${pct(est.settings.escPct, 2)}</b>.<br>
      ${isNum(src.price) ? `The tab's own total is <b>${money(src.price)}</b> for <b>${hrs(src.hours)}</b> hours.` : ''}</div>
      <p class="hint">Only the task rows, engineer levels, rates and settings come across. Expenses and the pricing columns stay in the workbook.</p>`;
    $('#xl-go').disabled = !est.tasks.length;
  } catch (err) { $('#xl-msg').innerHTML = `<p class="err">${h(err.message)}</p>`; $('#xl-go').disabled = true; }
}
function fileBase() { const p = S.project; return ([p.number, p.customer, p.name].filter(Boolean).join('_') || 'estimate').replace(/[^\w\-]+/g, '_').slice(0, 80); }
function downloadBlob(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
/* ---------- Boot ---------- */
S = load();
render();
status(S ? 'Saved in this browser' : '');

</script>
</body>
</html>
